<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f9">
<title>استودیو طراحی | نمونه‌کارها</title>
<meta name="description" id="metaDesc" content="طراحی وب‌سایت‌های مدرن و کاربردی با کمک هوش مصنوعی — مشاهده و دانلود رایگان فایل HTML نمونه‌کارها">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/vazirmatn@5.3.0/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.3.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.3.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.3.0/800.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b4bf5'/%3E%3Cpath d='M9 12h14M9 17h9M9 22h12' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">

<style>
/* ============ 1. TOKENS ============ */
:root{
  --fs: 1;
  --accent:#5b4bf5;
  --accent2:#8b5cf6;
  --radius:20px;

  --bg:#f4f5f9;
  --bg-2:#eceef6;
  --surface:#ffffff;
  --surface-2:#f8f9fd;
  --surface-3:#f1f3f9;
  --text:#0e1120;
  --text-2:#474f63;
  --muted:#7a8299;
  --border:rgba(14,17,32,.09);
  --border-2:rgba(14,17,32,.05);
  --accent-soft:color-mix(in srgb, var(--accent) 10%, transparent);
  --accent-line:color-mix(in srgb, var(--accent) 26%, transparent);
  --shadow-sm:0 1px 2px rgba(16,20,45,.05);
  --shadow:0 2px 4px rgba(16,20,45,.04), 0 12px 28px -8px rgba(16,20,45,.10);
  --shadow-lg:0 30px 70px -20px rgba(16,20,45,.22);
  --ok:#0f9d58; --ok-bg:rgba(15,157,88,.10);
  --err:#e5484d; --err-bg:rgba(229,72,77,.10);
  --warn:#d97706; --warn-bg:rgba(217,119,6,.11);
  --hdr-h:70px;
  --grad:linear-gradient(120deg,var(--accent),var(--accent2));
}
html[data-theme="dark"]{
  --bg:#070910;
  --bg-2:#0b0e17;
  --surface:#10141f;
  --surface-2:#151a27;
  --surface-3:#1b2130;
  --text:#edf0f8;
  --text-2:#a9b1c6;
  --muted:#727c94;
  --border:rgba(255,255,255,.09);
  --border-2:rgba(255,255,255,.05);
  --accent-soft:color-mix(in srgb, var(--accent) 16%, transparent);
  --accent-line:color-mix(in srgb, var(--accent) 34%, transparent);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 6px rgba(0,0,0,.35), 0 18px 40px -14px rgba(0,0,0,.6);
  --shadow-lg:0 34px 80px -24px rgba(0,0,0,.75);
  --ok:#3ddc84; --ok-bg:rgba(61,220,132,.12);
  --err:#ff6b6f; --err-bg:rgba(255,107,111,.13);
  --warn:#fbbf24; --warn-bg:rgba(251,191,36,.13);
  --accent:#7c6cff; --accent2:#a78bfa;
}

*,*::before,*::after{box-sizing:border-box}
html{font-size:calc(16px * var(--fs)); scroll-behavior:smooth; -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Vazirmatn Variable','Vazirmatn',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:.9375rem; line-height:1.85; overflow-x:hidden;
  transition:background .45s ease,color .45s ease;
}
body.locked{overflow:hidden}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.35;font-weight:800;letter-spacing:-.015em}
p{margin:0}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 34%,transparent);border-radius:99px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--muted) 55%,transparent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:6px}
.no-anim *,.no-anim *::before,.no-anim *::after{animation-duration:.001ms!important;transition-duration:.001ms!important}

.wrap{width:min(1200px,100% - 2.5rem);margin-inline:auto}

/* ============ 2. BACKGROUND ============ */
.bg-decor{position:fixed;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;will-change:transform}
html[data-theme="dark"] .blob{opacity:.30}
.blob.b1{width:520px;height:520px;top:-180px;right:-120px;background:radial-gradient(circle,var(--accent),transparent 68%);animation:fl1 26s ease-in-out infinite}
.blob.b2{width:460px;height:460px;top:38%;left:-160px;background:radial-gradient(circle,var(--accent2),transparent 68%);animation:fl2 32s ease-in-out infinite}
.blob.b3{width:400px;height:400px;bottom:-140px;right:26%;background:radial-gradient(circle,#22d3ee,transparent 68%);opacity:.22;animation:fl1 38s ease-in-out infinite reverse}
@keyframes fl1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-46px,52px) scale(1.12)}}
@keyframes fl2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(52px,-42px) scale(1.08)}}
.bg-grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--border-2) 1px,transparent 1px),linear-gradient(90deg,var(--border-2) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 20%,transparent 78%);
}
body[data-herobg="plain"] .bg-decor{display:none}
body[data-herobg="grid"] .blob{display:none}

/* ============ 3. BUTTONS ============ */
.btn{
  --bh:44px;
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  min-height:var(--bh);padding:0 1.25rem;border-radius:14px;border:1px solid transparent;
  font-weight:700;font-size:.875rem;cursor:pointer;position:relative;
  transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s,background .22s,border-color .22s,color .22s;
  white-space:nowrap;user-select:none;isolation:isolate;
}
.btn svg{width:18px;height:18px;flex:none}
.btn:active{transform:translateY(1px) scale(.985)}
.btn-p{background:var(--grad);color:#fff;box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 80%,transparent)}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 16px 34px -10px color-mix(in srgb,var(--accent) 85%,transparent)}
.btn-p::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,transparent 20%,rgba(255,255,255,.32),transparent 80%);transform:translateX(-120%);transition:transform .7s;z-index:-1}
.btn-p:hover::after{transform:translateX(120%)}
.btn-g{background:var(--surface);border-color:var(--border);color:var(--text);box-shadow:var(--shadow-sm)}
.btn-g:hover{border-color:var(--accent-line);color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.btn-s{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn-s:hover{background:color-mix(in srgb,var(--accent) 18%,transparent);transform:translateY(-2px)}
.btn-d{background:var(--err-bg);color:var(--err)}
.btn-d:hover{background:var(--err);color:#fff;transform:translateY(-2px)}
.btn-sm{--bh:36px;padding:0 .85rem;font-size:.8rem;border-radius:11px}
.btn-xs{--bh:30px;padding:0 .6rem;font-size:.74rem;border-radius:9px;gap:.3rem}
.btn-xs svg{width:14px;height:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn .spin,.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
.btn-g .spin,.btn-s .spin,.btn-d .spin{border-color:color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent)}
@keyframes sp{to{transform:rotate(360deg)}}

.icon-btn{
  width:42px;height:42px;display:grid;place-items:center;border-radius:13px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;color:var(--text-2);
  transition:.22s;box-shadow:var(--shadow-sm);flex:none;
}
.icon-btn:hover{color:var(--accent);border-color:var(--accent-line);transform:translateY(-2px)}
.icon-btn[disabled]{opacity:.35;pointer-events:none}
.icon-btn svg{width:19px;height:19px}

/* ============ 4. HEADER ============ */
.hdr{
  position:fixed;top:0;inset-inline:0;z-index:50;height:var(--hdr-h);
  display:flex;align-items:center;
  background:color-mix(in srgb,var(--bg) 74%,transparent);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border-bottom:1px solid transparent;transition:.35s;
}
.hdr.stuck{border-bottom-color:var(--border);background:color-mix(in srgb,var(--bg) 88%,transparent);box-shadow:0 6px 26px -18px rgba(0,0,0,.4)}
.hdr-in{display:flex;align-items:center;gap:1rem;width:min(1200px,100% - 2.5rem);margin-inline:auto}
.brand{display:flex;align-items:center;gap:.65rem;font-weight:800;font-size:1.02rem;letter-spacing:-.02em;margin-inline-end:auto}
.brand-mark{
  width:38px;height:38px;border-radius:12px;background:var(--grad);display:grid;place-items:center;
  color:#fff;font-size:.95rem;box-shadow:0 8px 20px -8px color-mix(in srgb,var(--accent) 90%,transparent);
  transition:transform .4s cubic-bezier(.22,1,.36,1);flex:none;
}
.brand:hover .brand-mark{transform:rotate(-8deg) scale(1.06)}
.brand small{display:block;font-size:.66rem;font-weight:500;color:var(--muted);letter-spacing:0}
.nav{display:flex;align-items:center;gap:.15rem}
.nav a{padding:.5rem .85rem;border-radius:11px;font-size:.855rem;font-weight:600;color:var(--text-2);transition:.2s}
.nav a:hover{color:var(--accent);background:var(--accent-soft)}
.nav a.active{color:var(--accent);background:var(--accent-soft)}
.hdr-act{display:flex;align-items:center;gap:.5rem}
.burger{display:none}
.mob-nav{
  position:fixed;top:var(--hdr-h);inset-inline:0;z-index:49;background:var(--surface);
  border-bottom:1px solid var(--border);padding:.75rem 1.25rem 1.25rem;
  display:none;flex-direction:column;gap:.25rem;box-shadow:var(--shadow-lg);animation:mnav .28s cubic-bezier(.22,1,.36,1);
}
.mob-nav.open{display:flex}
@keyframes mnav{from{opacity:0;transform:translateY(-12px)}}
.mob-nav a{padding:.8rem 1rem;border-radius:12px;font-weight:600;color:var(--text-2)}
.mob-nav a:hover,.mob-nav a.active{background:var(--accent-soft);color:var(--accent)}

.th-tog{position:relative;width:42px;height:42px;border-radius:13px;background:var(--surface);border:1px solid var(--border);cursor:pointer;overflow:hidden;box-shadow:var(--shadow-sm);transition:.22s;flex:none}
.th-tog:hover{border-color:var(--accent-line);transform:translateY(-2px)}
.th-tog span{position:absolute;inset:0;display:grid;place-items:center;transition:.45s cubic-bezier(.22,1,.36,1);color:var(--text-2)}
.th-tog svg{width:19px;height:19px}
.th-tog .i-sun{opacity:1;transform:rotate(0) scale(1)}
.th-tog .i-moon{opacity:0;transform:rotate(-90deg) scale(.4)}
html[data-theme="dark"] .th-tog .i-sun{opacity:0;transform:rotate(90deg) scale(.4)}
html[data-theme="dark"] .th-tog .i-moon{opacity:1;transform:rotate(0) scale(1);color:var(--warn)}

/* ============ 5. SECTIONS ============ */
main{padding-top:var(--hdr-h)}
.sec{padding:5.5rem 0;position:relative}
.sec-head{max-width:660px;margin-bottom:2.75rem}
.sec-head.center{margin-inline:auto;text-align:center}
.eyebrow{
  display:inline-flex;align-items:center;gap:.45rem;padding:.32rem .85rem;border-radius:99px;
  background:var(--accent-soft);color:var(--accent);font-size:.74rem;font-weight:700;margin-bottom:1rem;
  border:1px solid var(--accent-line);
}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.sec-title{font-size:clamp(1.6rem,3.6vw,2.4rem)}
.sec-sub{color:var(--text-2);margin-top:.85rem;font-size:.95rem}
.grad-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.22,1,.36,1),transform .8s cubic-bezier(.22,1,.36,1)}
.rv.in{opacity:1;transform:none}

/* ============ 6. HERO ============ */
.hero{padding:4.5rem 0 5rem;position:relative}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:3.5rem;align-items:center}
.hero h1{font-size:clamp(2rem,5.2vw,3.5rem);line-height:1.22;letter-spacing:-.03em}
.hero-lead{color:var(--text-2);font-size:1.03rem;margin-top:1.35rem;max-width:560px;line-height:2.05}
.hero-cta{display:flex;gap:.75rem;margin-top:2rem;flex-wrap:wrap}
.hero-stats{display:flex;gap:2.2rem;margin-top:2.75rem;flex-wrap:wrap;padding-top:2rem;border-top:1px solid var(--border)}
.hstat b{display:block;font-size:1.65rem;font-weight:800;letter-spacing:-.03em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hstat span{font-size:.78rem;color:var(--muted);font-weight:600}
.hero-vis{position:relative;perspective:1400px}
.mock{
  background:var(--surface);border:1px solid var(--border);border-radius:22px;overflow:hidden;
  box-shadow:var(--shadow-lg);animation:mfloat 7s ease-in-out infinite;transition:transform .5s;
  transform:rotateY(-9deg) rotateX(4deg);
}
.hero-vis:hover .mock{transform:rotateY(-3deg) rotateX(1deg) translateY(-6px)}
@keyframes mfloat{0%,100%{transform:rotateY(-9deg) rotateX(4deg) translateY(0)}50%{transform:rotateY(-9deg) rotateX(4deg) translateY(-14px)}}
.mock-bar{display:flex;align-items:center;gap:6px;padding:.7rem .9rem;background:var(--surface-2);border-bottom:1px solid var(--border)}
.mock-bar i{width:9px;height:9px;border-radius:50%;flex:none}
.mock-bar i:nth-child(1){background:#ff5f57}.mock-bar i:nth-child(2){background:#febc2e}.mock-bar i:nth-child(3){background:#28c840}
.mock-url{margin-inline-start:.6rem;flex:1;height:22px;border-radius:7px;background:var(--surface-3);display:flex;align-items:center;padding:0 .6rem;font-size:.63rem;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mock-body{padding:1.1rem}
.mb-hero{height:88px;border-radius:14px;background:var(--grad);position:relative;overflow:hidden;margin-bottom:.9rem}
.mb-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 25%,rgba(255,255,255,.35),transparent 75%);transform:translateX(-100%);animation:shine 3.4s infinite}
@keyframes shine{0%{transform:translateX(-100%)}60%,100%{transform:translateX(100%)}}
.mb-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-bottom:.9rem}
.mb-card{height:64px;border-radius:12px;background:var(--surface-3);border:1px solid var(--border-2);position:relative;overflow:hidden}
.mb-card::before{content:"";position:absolute;inset-inline:10px;top:12px;height:7px;border-radius:4px;background:var(--accent-line)}
.mb-card::after{content:"";position:absolute;inset-inline:10px;top:28px;height:5px;border-radius:4px;background:var(--border)}
.mb-lines{display:flex;flex-direction:column;gap:7px}
.mb-lines i{height:6px;border-radius:4px;background:var(--border);display:block}
.mb-lines i:nth-child(1){width:88%}.mb-lines i:nth-child(2){width:64%}.mb-lines i:nth-child(3){width:76%}
.fchip{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:.6rem .85rem;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:.55rem;font-size:.76rem;font-weight:700;animation:chipf 5.5s ease-in-out infinite}
.fchip .dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok);flex:none}
.fchip .dot svg{width:15px;height:15px}
.fchip small{display:block;font-weight:500;color:var(--muted);font-size:.66rem}
.chip-1{top:-18px;left:-14px;animation-delay:.4s}
.chip-2{bottom:26px;right:-20px;animation-delay:1.6s}
.chip-2 .dot{background:var(--accent-soft);color:var(--accent)}
@keyframes chipf{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.hero-glow{position:absolute;width:78%;aspect-ratio:1;top:8%;right:6%;background:radial-gradient(circle,var(--accent),transparent 66%);filter:blur(70px);opacity:.30;z-index:-1;border-radius:50%}

/* ============ 7. ABOUT ============ */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:3.5rem;align-items:center}
.about-visual{position:relative}
.about-card{border-radius:26px;overflow:hidden;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);position:relative;aspect-ratio:4/4.6}
.about-card img{width:100%;height:100%;object-fit:cover}
.about-fallback{position:absolute;inset:0;display:grid;place-items:center;background:var(--grad);opacity:.94}
.about-badge{position:absolute;bottom:-18px;inset-inline-start:-14px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:.85rem 1.15rem;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:.7rem}
.about-badge b{font-size:1.3rem;display:block;line-height:1.2}
.about-badge span{font-size:.72rem;color:var(--muted);font-weight:600}
.about-badge .ring{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.about-badge .ring svg{width:22px;height:22px}
.about-txt p{color:var(--text-2);margin-bottom:1rem}
.skill-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.7rem;margin:1.6rem 0}
.skill{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;background:var(--surface);border:1px solid var(--border);border-radius:14px;font-size:.83rem;font-weight:600;transition:.24s;box-shadow:var(--shadow-sm)}
.skill:hover{transform:translateY(-3px);border-color:var(--accent-line);box-shadow:var(--shadow)}
.skill i{width:8px;height:8px;border-radius:3px;background:var(--grad);flex:none;transform:rotate(45deg)}
.ai-note{margin-top:1.6rem;padding:1.35rem 1.5rem;border-radius:18px;background:linear-gradient(120deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);border-inline-start:4px solid var(--accent)}
.ai-note h4{display:flex;align-items:center;gap:.5rem;font-size:.95rem;margin-bottom:.5rem}
.ai-note h4 svg{width:19px;height:19px;color:var(--accent)}
.ai-note p{font-size:.855rem;color:var(--text-2);margin:0}

/* ============ 8. WORKS ============ */
.tools{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;margin-bottom:1.8rem;padding:1rem;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm)}
.search{position:relative;flex:1;min-width:210px}
.search svg{position:absolute;inset-inline-start:.9rem;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);padding:0 .95rem 0 2.6rem;transition:.22s;font-size:.86rem}
.search input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{padding:.42rem .95rem;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:.79rem;font-weight:600;color:var(--text-2);cursor:pointer;transition:.22s;white-space:nowrap}
.chip:hover{border-color:var(--accent-line);color:var(--accent)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 90%,transparent)}
.sel{height:44px;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);padding:0 .9rem;font-size:.83rem;font-weight:600;cursor:pointer}
.sel:focus{outline:none;border-color:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.5rem}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-sm);transition:transform .38s cubic-bezier(.22,1,.36,1),box-shadow .38s,border-color .38s;position:relative}
.card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg);border-color:var(--accent-line)}
.card-media{position:relative;aspect-ratio:16/10.5;overflow:hidden;background:var(--surface-3)}
.card-media img{width:100%;height:100%;object-fit:cover;transition:transform .75s cubic-bezier(.22,1,.36,1)}
.card:hover .card-media img{transform:scale(1.075)}
.card-media::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(6,8,18,.5),transparent 55%);opacity:0;transition:.4s}
.card:hover .card-media::after{opacity:1}
.badges{position:absolute;top:.75rem;inset-inline-start:.75rem;display:flex;gap:.35rem;flex-wrap:wrap;z-index:2}
.badge{padding:.22rem .6rem;border-radius:8px;font-size:.66rem;font-weight:800;backdrop-filter:blur(8px)}
.badge.new{background:rgba(15,157,88,.92);color:#fff}
.badge.feat{background:rgba(217,119,6,.94);color:#fff}
.badge.rec{background:rgba(91,75,245,.94);color:#fff}
.badge.cat{background:rgba(255,255,255,.88);color:#1a1d2b}
html[data-theme="dark"] .badge.cat{background:rgba(20,24,36,.86);color:#e8ebf5}
.quick{position:absolute;inset-inline-end:.75rem;top:.75rem;z-index:2;opacity:0;transform:translateY(-8px);transition:.35s}
.card:hover .quick{opacity:1;transform:none}
.quick .icon-btn{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.9);border-color:transparent}
html[data-theme="dark"] .quick .icon-btn{background:rgba(22,26,38,.9)}
.card-body{padding:1.15rem 1.25rem 1.25rem;display:flex;flex-direction:column;flex:1;gap:.55rem}
.card-title{font-size:1.03rem;font-weight:800;letter-spacing:-.02em}
.card-title a:hover{color:var(--accent)}
.card-desc{font-size:.83rem;color:var(--text-2);line-height:1.85;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:.6rem;font-size:.73rem;color:var(--muted);flex-wrap:wrap}
.card-meta .sep{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.5}
.card-foot{display:flex;align-items:center;gap:.5rem;margin-top:auto;padding-top:.9rem;border-top:1px solid var(--border-2)}
.price{font-weight:800;font-size:.98rem;letter-spacing:-.02em}
.price.free{color:var(--ok)}
.card-foot .btn{margin-inline-start:auto}
.empty{grid-column:1/-1;text-align:center;padding:4.5rem 1.5rem;background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--radius)}
.empty svg{width:56px;height:56px;color:var(--muted);opacity:.45;margin:0 auto 1rem}
.empty h3{font-size:1.1rem;margin-bottom:.4rem}
.empty p{color:var(--muted);font-size:.86rem}
.sk{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:340px}
.sk div{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:skl 1.4s infinite}
.sk .a{height:56%}.sk .b{height:14px;margin:16px;border-radius:6px}.sk .c{height:10px;margin:0 16px 16px;width:60%;border-radius:6px}
@keyframes skl{to{background-position:-200% 0}}

/* ============ 9. CONTACT ============ */
.contact-grid{display:grid;grid-template-columns:1fr 1.15fr;gap:2rem;align-items:start}
.info-list{display:flex;flex-direction:column;gap:.75rem}
.info{display:flex;align-items:center;gap:1rem;padding:1.05rem 1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);transition:.28s}
.info:hover{transform:translateX(-6px);border-color:var(--accent-line);box-shadow:var(--shadow)}
.info .ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;transition:.28s}
.info:hover .ic{background:var(--grad);color:#fff}
.info .ic svg{width:20px;height:20px}
.info b{display:block;font-size:.75rem;color:var(--muted);font-weight:600;margin-bottom:.1rem}
.info span span{font-size:.9rem;font-weight:700;word-break:break-word;direction:ltr;text-align:right}
.socials{display:flex;gap:.6rem;margin-top:1.25rem;flex-wrap:wrap}
.soc{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--text-2);transition:.28s;box-shadow:var(--shadow-sm)}
.soc:hover{transform:translateY(-4px) rotate(-6deg);color:#fff;background:var(--grad);border-color:transparent}
.soc svg{width:20px;height:20px}
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:1.85rem;box-shadow:var(--shadow)}
.form-card h3{font-size:1.15rem;margin-bottom:.3rem}
.form-card>p{color:var(--muted);font-size:.83rem;margin-bottom:1.4rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.fld{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.9rem}
.fld.full{grid-column:1/-1}
.fld label{font-size:.79rem;font-weight:700;color:var(--text-2)}
.fld label .req{color:var(--err)}
.fld input,.fld textarea,.fld select{width:100%;border-radius:13px;border:1px solid var(--border);background:var(--surface-2);padding:.72rem .95rem;font-size:.87rem;transition:.22s;resize:vertical}
.fld textarea{min-height:120px;line-height:1.8}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 4px var(--accent-soft)}
.fld.bad input,.fld.bad textarea,.fld.bad select{border-color:var(--err);background:var(--err-bg)}
.fld .err{font-size:.72rem;color:var(--err);font-weight:600;display:none}
.fld.bad .err{display:block}
.fld .hint{font-size:.71rem;color:var(--muted)}
.fld input[type="color"]{padding:4px;height:46px;cursor:pointer}
.fld input[type="range"]{padding:0;height:30px;background:none;border:none;box-shadow:none;accent-color:var(--accent);cursor:pointer}
.fld input[type="range"]:focus{box-shadow:none}

/* ============ 10. FOOTER ============ */
.ftr{border-top:1px solid var(--border);background:color-mix(in srgb,var(--surface) 55%,transparent);padding:2.5rem 0;margin-top:2rem}
.ftr-in{display:flex;align-items:center;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
.ftr p{color:var(--muted);font-size:.82rem}
.ftr-links{display:flex;gap:1.25rem;flex-wrap:wrap}
.ftr-links a{font-size:.82rem;color:var(--text-2);font-weight:600;transition:.2s}
.ftr-links a:hover{color:var(--accent)}

/* ============ 11. TOASTS ============ */
#toasts{position:fixed;bottom:1.25rem;inset-inline-start:1.25rem;z-index:9999;display:flex;flex-direction:column;gap:.55rem;max-width:min(380px,calc(100vw - 2.5rem))}
.toast{display:flex;align-items:flex-start;gap:.7rem;padding:.85rem 1.05rem;border-radius:15px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:.83rem;font-weight:600;animation:tin .38s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes tout{to{opacity:0;transform:translateX(-30px) scale(.94)}}
.toast .ti{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.toast .ti svg{width:13px;height:13px}
.toast.success .ti{background:var(--ok-bg);color:var(--ok)}
.toast.error .ti{background:var(--err-bg);color:var(--err)}
.toast.info .ti{background:var(--accent-soft);color:var(--accent)}
.toast::after{content:"";position:absolute;bottom:0;inset-inline-start:0;height:2.5px;background:var(--accent);animation:tbar 3.4s linear forwards;width:100%}
.toast.success::after{background:var(--ok)}.toast.error::after{background:var(--err)}
@keyframes tbar{to{width:0}}

#netbar{position:fixed;top:0;inset-inline:0;z-index:10000;display:none}
#netbar.show{display:block}
#netbar .in{background:var(--err);color:#fff;padding:.5rem 1rem;text-align:center;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap}
#netbar.warn .in{background:var(--warn)}
#netbar .in button{background:rgba(255,255,255,.22);border:none;color:#fff;border-radius:8px;padding:.15rem .6rem;cursor:pointer;font-size:.72rem;font-weight:700}

#toTop{position:fixed;bottom:1.25rem;inset-inline-end:1.25rem;z-index:60;width:46px;height:46px;border-radius:15px;background:var(--surface);border:1px solid var(--border);color:var(--text-2);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transform:translateY(14px);transition:.32s}
#toTop.show{opacity:1;pointer-events:auto;transform:none}
#toTop:hover{color:var(--accent);border-color:var(--accent-line)}
#toTop svg{width:19px;height:19px}

/* ============ 12. PAGES ============ */
.page{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;display:none}
.page.open{display:block;animation:pgin .38s cubic-bezier(.22,1,.36,1)}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
.page-bar{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:.75rem;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 1.25rem}
.page-bar .ttl{font-weight:800;font-size:.95rem;margin-inline-end:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb{font-size:.72rem;color:var(--muted);font-weight:600}
.dt-hero{padding:2.5rem 0 0}
.dt-cover{border-radius:24px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-lg);aspect-ratio:16/8;background:var(--surface-3);margin-bottom:2rem}
.dt-cover img{width:100%;height:100%;object-fit:cover}
.dt-layout{display:grid;grid-template-columns:1fr 340px;gap:2.5rem;align-items:start;padding-bottom:4rem}
.dt-title{font-size:clamp(1.5rem,3.6vw,2.2rem);letter-spacing:-.03em}
.dt-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin:1rem 0 1.5rem}
.tag{padding:.28rem .75rem;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:.72rem;font-weight:700;color:var(--text-2)}
.dt-body{color:var(--text-2);font-size:.94rem;line-height:2.1;white-space:pre-wrap}
.dt-side{position:sticky;top:88px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.5rem;box-shadow:var(--shadow)}
.dt-price{font-size:1.85rem;font-weight:800;letter-spacing:-.03em;margin-bottom:.2rem}
.dt-price small{font-size:.8rem;color:var(--muted);font-weight:600;margin-inline-start:.2rem}
.dt-rows{margin:1.25rem 0;padding:1.25rem 0;border-block:1px solid var(--border-2);display:flex;flex-direction:column;gap:.85rem}
.dt-row{display:flex;justify-content:space-between;gap:1rem;font-size:.82rem}
.dt-row span{color:var(--muted);font-weight:600;flex:none}
.dt-row b{font-weight:700;text-align:left}
.dt-acts{display:flex;flex-direction:column;gap:.6rem}

/* =================================================================== */
/* ==================== 13. ADMIN PANEL (v2) ========================= */
/* =================================================================== */
#adminPage{display:none;background:var(--bg);z-index:80}
#adminPage.open{display:block;overflow:hidden}

/* --- Login --- */
.lgn{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr;position:relative}
.lgn-art{position:relative;overflow:hidden;background:var(--grad);display:grid;place-items:center;padding:3rem;color:#fff}
.lgn-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.09) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 50%,#000,transparent 78%)}
.lgn-orb{position:absolute;border-radius:50%;filter:blur(60px);background:rgba(255,255,255,.35)}
.lgn-orb.o1{width:320px;height:320px;top:-90px;right:-70px;animation:fl1 16s ease-in-out infinite}
.lgn-orb.o2{width:260px;height:260px;bottom:-80px;left:-60px;animation:fl2 20s ease-in-out infinite}
.lgn-art-in{position:relative;z-index:2;max-width:420px}
.lgn-art-in .bm{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;font-size:1.4rem;font-weight:800;margin-bottom:1.5rem;backdrop-filter:blur(8px)}
.lgn-art-in h2{font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:.8rem;letter-spacing:-.03em}
.lgn-art-in p{opacity:.9;font-size:.9rem;line-height:2}
.lgn-feat{margin-top:2rem;display:flex;flex-direction:column;gap:.7rem}
.lgn-feat div{display:flex;align-items:center;gap:.65rem;font-size:.84rem;font-weight:600;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);padding:.6rem .9rem;border-radius:13px;backdrop-filter:blur(8px)}
.lgn-feat svg{width:17px;height:17px;flex:none}
.lgn-form{display:grid;place-items:center;padding:2rem 1.5rem;background:var(--bg);overflow-y:auto}
.lgn-card{width:min(400px,100%);animation:lgin .55s cubic-bezier(.22,1,.36,1)}
@keyframes lgin{from{opacity:0;transform:translateY(24px) scale(.97)}}
.lgn-ic{width:58px;height:58px;border-radius:19px;background:var(--grad);color:#fff;display:grid;place-items:center;margin-bottom:1.4rem;box-shadow:0 16px 34px -14px color-mix(in srgb,var(--accent) 95%,transparent)}
.lgn-ic svg{width:26px;height:26px}
.lgn-card h3{font-size:1.4rem;margin-bottom:.4rem}
.lgn-card>p{color:var(--muted);font-size:.85rem;margin-bottom:1.6rem}
.shake{animation:shk .45s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pw-wrap{position:relative}
.pw-wrap .eye{position:absolute;inset-inline-end:.6rem;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:none;border:none;cursor:pointer;color:var(--muted)}
.pw-wrap .eye:hover{color:var(--accent)}
.pw-wrap .eye svg{width:17px;height:17px}

/* --- Shell --- */
.adm{display:grid;grid-template-columns:274px minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
.adm-scrim{display:none;position:fixed;inset:0;background:rgba(4,6,14,.55);backdrop-filter:blur(3px);z-index:39}
.adm-scrim.open{display:block;animation:fdin .25s}
@keyframes fdin{from{opacity:0}}
.adm-side{background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;min-height:0;z-index:41}
.adm-brand{display:flex;align-items:center;gap:.7rem;padding:1.05rem 1.1rem;border-bottom:1px solid var(--border);flex:none}
.adm-brand .bm{width:38px;height:38px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.95rem;flex:none;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 90%,transparent)}
.adm-brand b{font-size:.9rem;display:block;letter-spacing:-.02em;line-height:1.4;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-brand small{font-size:.65rem;color:var(--muted);font-weight:600}
.adm-x{display:none;width:32px;height:32px;margin-inline-start:auto;border-radius:10px}
.adm-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:.7rem .65rem 1rem;display:flex;flex-direction:column;gap:2px;min-height:0}
.adm-nav .grp{font-size:.62rem;font-weight:800;color:var(--muted);letter-spacing:.1em;padding:.95rem .8rem .4rem}
.adm-nav button{display:flex;align-items:center;gap:.7rem;width:100%;padding:.6rem .8rem;border-radius:12px;background:none;border:none;cursor:pointer;font-size:.845rem;font-weight:600;color:var(--text-2);transition:.18s;text-align:start;position:relative}
.adm-nav button svg{width:18px;height:18px;flex:none;opacity:.7}
.adm-nav button:hover{background:var(--surface-2);color:var(--text)}
.adm-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.adm-nav button.on svg{opacity:1}
.adm-nav button.on::before{content:"";position:absolute;inset-inline-start:-.65rem;top:50%;transform:translateY(-50%);width:3px;height:20px;border-radius:0 4px 4px 0;background:var(--accent)}
.adm-nav .cnt{margin-inline-start:auto;font-size:.63rem;min-width:20px;text-align:center;background:var(--surface-3);padding:.05rem .4rem;border-radius:99px;font-weight:800;color:var(--muted)}
.adm-nav button.on .cnt{background:var(--accent);color:#fff}
.adm-side-foot{padding:.8rem;border-top:1px solid var(--border);flex:none;display:flex;flex-direction:column;gap:.5rem}
.adm-user{display:flex;align-items:center;gap:.65rem;padding:.5rem .6rem;border-radius:13px;background:var(--surface-2);border:1px solid var(--border-2);margin-bottom:.15rem}
.adm-av{width:34px;height:34px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem;flex:none}
.adm-user b{font-size:.8rem;display:block;line-height:1.4;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adm-user small{font-size:.64rem;color:var(--muted)}

.adm-main{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.adm-top{flex:none;display:flex;align-items:center;gap:.6rem;padding:.75rem 1.4rem;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:6}
.adm-top .ti{min-width:0;margin-inline-end:auto}
.adm-top h2{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adm-burger{display:none;width:38px;height:38px}
.adm-mtabs{display:none}
.adm-body{flex:1;overflow-y:auto;min-height:0;padding:1.5rem 1.4rem 5rem;animation:adin .4s cubic-bezier(.22,1,.36,1)}
@keyframes adin{from{opacity:0;transform:translateY(12px)}}

/* --- Admin components --- */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.9rem;margin-bottom:1.35rem}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:1.15rem 1.2rem;box-shadow:var(--shadow-sm);transition:.3s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--accent-line)}
.stat::before{content:"";position:absolute;top:0;inset-inline-start:0;width:100%;height:3px;background:var(--grad)}
.stat .ic{width:42px;height:42px;border-radius:13px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:.8rem}
.stat .ic svg{width:20px;height:20px}
.stat b{display:block;font-size:1.7rem;font-weight:800;letter-spacing:-.035em;line-height:1.2}
.stat span{font-size:.75rem;color:var(--muted);font-weight:600}
.stat.g1 .ic{background:var(--ok-bg);color:var(--ok)}
.stat.g2 .ic{background:var(--warn-bg);color:var(--warn)}
.stat.g3 .ic{background:var(--err-bg);color:var(--err)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-sm);overflow:hidden;margin-bottom:1.15rem;scroll-margin-top:90px}
.panel-h{display:flex;align-items:center;gap:.7rem;padding:1rem 1.25rem;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--surface-2)}
.panel-h h3{font-size:.95rem;margin-inline-end:auto;display:flex;align-items:center;gap:.5rem}
.panel-h h3 svg{width:18px;height:18px;color:var(--accent)}
.panel-b{padding:1.25rem}
.panel-b.tight{padding:0}
.two-col{display:grid;grid-template-columns:1.3fr 1fr;gap:1.15rem;align-items:start}

.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:start;font-size:.68rem;font-weight:800;color:var(--muted);letter-spacing:.05em;padding:.7rem .9rem;background:var(--surface-2);border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:.7rem .9rem;border-bottom:1px solid var(--border-2);font-size:.835rem;vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:.16s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr.dragging{opacity:.4}
.tbl tbody tr.dragover{box-shadow:inset 0 3px 0 var(--accent)}
.tbl-scroll{overflow-x:auto}
.thumb{width:60px;height:40px;border-radius:9px;object-fit:cover;background:var(--surface-3);border:1px solid var(--border);flex:none}
.row-acts{display:flex;gap:.28rem;justify-content:flex-end;flex-wrap:wrap}
.mico{width:31px;height:31px;border-radius:9px}
.mico svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .62rem;border-radius:99px;font-size:.68rem;font-weight:800;white-space:nowrap}
.pill.on{background:var(--ok-bg);color:var(--ok)}
.pill.off{background:var(--surface-3);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.wr{background:var(--warn-bg);color:var(--warn)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}

/* ------------------------------------------------------------------ toast */
function toast(msg,type="info",ms=3400){
  const host=$("#toasts"); if(!host) return;
  const el=document.createElement("div"); el.className="toast "+type;
  const ic = type==="success"?ICON.check : type==="error"?ICON.alert : ICON.spark;
  el.innerHTML='<span class="ti">'+ic+'</span><span>'+esc(msg)+'</span>';
  host.appendChild(el);
  setTimeout(()=>{el.classList.add("out");setTimeout(()=>el.remove(),320)},ms);
}
function netbar(msg,warn){
  const b=$("#netbar"); if(!msg){b.classList.remove("show","warn");return;}
  $("#netbarMsg").textContent=msg; b.classList.toggle("warn",!!warn); b.classList.add("show");
}
function saving(on,text){ const ov=$("#savingOv"); if(text)$("#savingTx").textContent=text; ov.style.display=on?"grid":"none"; }
function confirmDialog(title,message,okLabel,danger){
  return new Promise(resolve=>{
    const bd=$("#modalBd"),box=$("#modalBox");
    box.innerHTML='<div style="width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:1rem;background:'+(danger?'var(--err-bg);color:var(--err)':'var(--accent-soft);color:var(--accent)')+'">'+ICON.alert+'</div>'+
      '<h3 style="font-size:1.05rem;margin-bottom:.4rem">'+esc(title)+'</h3><p style="color:var(--text-2);font-size:.85rem;margin-bottom:1.5rem;line-height:1.85">'+esc(message)+'</p>'+
      '<div style="display:flex;gap:.6rem;justify-content:flex-end"><button class="btn btn-g" data-c="0">انصراف</button><button class="btn '+(danger?'btn-d':'btn-p')+'" data-c="1">'+esc(okLabel||'تأیید')+'</button></div>';
    bd.style.display="grid";
    const done=v=>{bd.style.display="none";box.innerHTML="";resolve(v)};
    box.onclick=e=>{const b=e.target.closest("[data-c]");if(b)done(b.dataset.c==="1")};
    bd.onclick=e=>{if(e.target===bd)done(false)};
  });
}

let DB_MODE = "online";
const dbUrl = p => DB_URL + "/" + String(p).replace(/^\/+|\/+$/g,"") + ".json";
async function dbFetch(path,method,body,headers){
  const res = await fetch(dbUrl(path),{method:method||"GET",headers:Object.assign({"Content-Type":"application/json"},headers||{}),body:body===undefined?undefined:JSON.stringify(body)});
  if(!res.ok){
    let detail=""; try{const j=await res.json(); if(j&&j.error) detail=j.error;}catch(_){}
    if(res.status===401||res.status===403){ const e=new Error("دسترسی به پایگاه داده مجاز نیست (Rules بسته است)."); e.status=res.status; throw e; }
    const e=new Error("خطای پایگاه داده: "+(detail||res.status)); e.status=res.status; throw e;
  }
  return res;
}
const dbGet = async p => (await dbFetch(p,"GET")).json();
const dbPut = async (p,v) => { await dbFetch(p,"PUT",v); return v; };
const dbDel = async p => { await dbFetch(p,"DELETE"); return true; };
async function dbTx(path,fn){
  for(let i=0;i<4;i++){
    const r=await fetch(dbUrl(path),{headers:{"X-Firebase-ETag":"true"}});
    if(!r.ok) throw new Error("خطا "+r.status);
    const etag=r.headers.get("ETag"), cur=await r.json(), next=fn(cur);
    const h={"Content-Type":"application/json"}; if(etag) h["if-match"]=etag;
    const p=await fetch(dbUrl(path),{method:"PUT",headers:h,body:JSON.stringify(next)});
    if(p.ok) return next;
    if(p.status===409||p.status===412) continue;
    throw new Error("خطا "+p.status);
  }
  throw new Error("به‌روزرسانی ناموفق بود");
}
const mirror={
  read(){try{return JSON.parse(localStorage.getItem(LS.cache)||"{}")}catch(e){return {}}},
  write(o){try{localStorage.setItem(LS.cache,JSON.stringify(o))}catch(e){}},
  get(p){const o=mirror.read();let v=o;for(const k of String(p).split("/").filter(Boolean)){if(v==null)return null;v=v[k];}return v===undefined?null:v},
  set(p,val){const o=mirror.read();const parts=String(p).split("/").filter(Boolean);let t=o;
    for(let i=0;i<parts.length-1;i++){t[parts[i]]=t[parts[i]]||{};t=t[parts[i]];}
    if(val===null) delete t[parts[parts.length-1]]; else t[parts[parts.length-1]]=val;
    mirror.write(o);return val;}
};
function handleDbError(e,verb){
  if(DB_MODE!=="offline"){
    DB_MODE="offline";

    const msg=off?"اتصال اینترنت برقرار نیست — تغییرات به‌صورت موقت در مرورگر ذخیره می‌شوند."

    netbar(msg,!off);
    toast((verb||"عملیات")+" به‌صورت محلی انجام شد (پایگاه داده در دسترس نیست)","error",5200);
    paintNavSafe();
  }
}

function mergeDeep(b,o){
  if(!o||typeof o!=="object") return o===undefined?b:o;
  for(const k in o){
    if(o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k])&&b[k]&&typeof b[k]==="object") b[k]=mergeDeep(b[k],o[k]);
    else b[k]=o[k];
  }
  return b;
}

function setTheme(t,save=true){
  document.documentElement.dataset.theme=t;
  if(save) localStorage.setItem(LS.theme,t);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content = t==="dark"?"#070910":"#f4f5f9";
}
function initTheme(){
  let t=localStorage.getItem(LS.theme);
  if(t!=="dark"&&t!=="light") t=(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
  setTheme(t,false);
}
function toggleTheme(){ setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"); toast(document.documentElement.dataset.theme==="dark"?"تم تاریک فعال شد":"تم روشن فعال شد","success",1600); }
$("#themeBtn").addEventListener("click",toggleTheme);

function applyAppearance(){
  const a=S.appearance||{}, r=document.documentElement.style;
  r.setProperty("--accent",a.accent||DEFAULT_APP.accent);
  r.setProperty("--accent2",a.accent2||DEFAULT_APP.accent2);
  r.setProperty("--radius",(Number(a.radius)||DEFAULT_APP.radius)+"px");
  r.setProperty("--fs",Number(a.fontScale)||1);
  document.body.classList.toggle("no-anim",a.animations===false);
  document.body.dataset.herobg=a.heroBg||"mesh";
}

/* ------------------------------------------------------------ cover art */
const PALETTES=[["#6366f1","#a855f7","#ec4899"],["#0ea5e9","#6366f1","#8b5cf6"],["#14b8a6","#0ea5e9","#6366f1"],["#f59e0b","#ef4444","#ec4899"],["#10b981","#14b8a6","#0ea5e9"],["#8b5cf6","#d946ef","#f43f5e"],["#0f172a","#334155","#6366f1"],["#f97316","#f59e0b","#fbbf24"]];
function hashStr(s){let h=0;for(let i=0;i<String(s).length;i++){h=(h*31+String(s).charCodeAt(i))>>>0}return h}
function artCover(seed,label){
  const p=PALETTES[hashStr(seed)%PALETTES.length], h=hashStr(seed+"x"), ch=(label||"W").trim().charAt(0)||"W";
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">'+
   '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+p[0]+'"/><stop offset=".55" stop-color="'+p[1]+'"/><stop offset="1" stop-color="'+p[2]+'"/></linearGradient>'+
   '<linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>'+
   '<rect width="800" height="500" fill="url(#g)"/>'+
   '<g opacity=".28" fill="none" stroke="#fff" stroke-width="1.4"><path d="M0 '+(120+h%60)+' C 200 '+(40+h%80)+', 420 '+(260+h%70)+', 800 '+(90+h%90)+'"/><path d="M0 '+(300+h%50)+' C 240 '+(200+h%90)+', 520 '+(400+h%40)+', 800 '+(250+h%70)+'"/></g>'+
   '<circle cx="'+(140+h%90)+'" cy="'+(110+h%70)+'" r="'+(70+h%50)+'" fill="url(#s)"/><circle cx="'+(620+h%80)+'" cy="'+(360+h%60)+'" r="'+(90+h%60)+'" fill="url(#s)"/>'+
   '<rect x="'+(300+h%60)+'" y="'+(60+h%40)+'" width="200" height="130" rx="18" fill="#fff" opacity=".14"/>'+
   '<rect x="'+(330+h%60)+'" y="'+(220+h%40)+'" width="140" height="90" rx="14" fill="#000" opacity=".13"/>'+
   '<text x="400" y="268" font-family="Vazirmatn,Segoe UI,Arial,sans-serif" font-size="120" font-weight="800" fill="#fff" fill-opacity=".92" text-anchor="middle">'+esc(ch)+'</text></svg>';
  return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
}
const coverOf = w => (w.cover && String(w.cover).length>60) ? w.cover : artCover((w.id||"")+w.title, w.title);

function visibleWorks(){
  let l=S.works.filter(w=>w.published);
  if(S.ui.filter&&S.ui.filter!=="همه") l=l.filter(w=>(w.category||"عمومی")===S.ui.filter);
  if(S.ui.query){const q=S.ui.query.toLowerCase();l=l.filter(w=>((w.title||"")+" "+(w.desc||"")+" "+(w.category||"")+" "+(Array.isArray(w.tags)?w.tags.join(" "):"")).toLowerCase().includes(q));}
  l=l.slice().sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)||(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
  if(S.ui.sort==="dl") l.sort((a,b)=>(Number(b.downloads)||0)-(Number(a.downloads)||0));
  else if(S.ui.sort==="az") l.sort((a,b)=>String(a.title).localeCompare(String(b.title),"fa"));
  else if(S.ui.sort==="new") l.sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));
  return l;
}

function renderSections(){
  const order=(S.site.sectionsOrder&&S.site.sectionsOrder.length)?S.site.sectionsOrder:["hero","about","works","contact"];
  const map={hero:sectionHero,about:sectionAbout,works:sectionWorks,contact:sectionContact};
  $("#sections").innerHTML=order.filter(k=>map[k]&&site(k,"visible",true)).map(k=>map[k]()).join("");
  observeReveals(); bindWorksTools();
  const cf=$("#contactForm"); if(cf) cf.addEventListener("submit",onContactSubmit);
}
let io;
function observeReveals(root){
  root=root||document;
  if(!("IntersectionObserver" in window)){$$(".rv",root).forEach(e=>e.classList.add("in"));return;}
  if(!io) io=new IntersectionObserver(en=>{en.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{rootMargin:"0px 0px -8% 0px",threshold:.06});
  $$(".rv:not(.in)",root).forEach((el,i)=>{el.style.transitionDelay=Math.min(i*45,320)+"ms";io.observe(el)});
}
function markActiveNav(){
  const secs=["hero","about","works","contact"].map(id=>document.getElementById(id)).filter(Boolean);
  if(!secs.length) return;
  const obs=new IntersectionObserver(en=>{en.forEach(e=>{if(e.isIntersecting){const id=e.target.id;$$("[data-nav]").forEach(a=>a.classList.toggle("active",a.dataset.nav===id))}})},{rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(s=>obs.observe(s));
}
function bindWorksTools(){
  const q=$("#wq");
  if(q) q.addEventListener("input",()=>{ S.ui.query=q.value.trim(); refreshWorks(); const n=$("#wq"); if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)} });
  $$("#wcats .chip").forEach(b=>b.addEventListener("click",()=>{S.ui.filter=b.dataset.cat;refreshWorks()}));
  const s=$("#wsort"); if(s) s.addEventListener("change",()=>{S.ui.sort=s.value;refreshWorks()});
}

/* ============================================================= DOWNLOADS */
async function getFile(id){
  if(S.files[id]&&S.files[id].html!=null) return S.files[id];
  let f=null;
  try{ f=await dbGet("files/"+id); }catch(e){ f=mirror.get("files/"+id); if(f===undefined)f=null; handleDbError(e,"خواندن فایل"); }
  if(f) S.files[id]=f;
  return f;
}
async function doDownload(id,btn){
  const w=S.works.find(x=>x.id===id);
  if(!w){toast("نمونه‌کار یافت نشد","error");return}
  const old=btn?btn.innerHTML:"";
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span><span>در حال آماده‌سازی…</span>'}
  try{
    const f=await getFile(id);
    if(!f||!f.html){toast("فایل HTML این نمونه‌کار هنوز بارگذاری نشده است.","error",4200);return}
    const name=f.name||(fileBase(w.title)+".html");
    const blob=new Blob([String(f.html)],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    toast("دانلود آغاز شد: "+name,"success");
    bumpDownload(id);
  }catch(err){ toast("خطا در دانلود: "+(err.message||""),"error",5000); }
  finally{ if(btn){btn.disabled=false;btn.innerHTML=old} }
}
async function bumpDownload(id){
  const w=S.works.find(x=>x.id===id); if(!w)return;
  w.downloads=(Number(w.downloads)||0)+1;
  S.stats.downloads=(Number(S.stats.downloads)||0)+1;
  renderSections(); refreshAdminIfOpen();
  try{
    await dbTx("portfolio/"+id+"/downloads",v=>(typeof v==="number"?v:0)+1);
    await dbTx("stats/downloads",v=>(typeof v==="number"?v:0)+1);
    DB_MODE="online";

/* ============================================================== ROUTER */
function router(){
  const h=(location.hash||"#/").replace(/^#/,"");
  const detail=$("#detailPage"), admin=$("#adminPage");
  closeMenu();
  if(h.startsWith("/work/")){
    admin.classList.remove("open"); detail.classList.add("open");
    document.body.classList.add("locked");
    renderDetail(decodeURIComponent(h.slice(6))); return;
  }
  detail.classList.remove("open");
  if(h.startsWith("/admin")){
    document.body.classList.add("locked"); admin.classList.add("open"); renderAdmin(); return;
  }
  admin.classList.remove("open"); document.body.classList.remove("locked");
  if(h==="works"||h==="/works"){ setTimeout(()=>{const e=document.getElementById("works");if(e)e.scrollIntoView({behavior:"smooth"})},60); }
}
window.addEventListener("hashchange",router);
function closeMenu(){ $("#mobNav").classList.remove("open"); }
$("#burger").addEventListener("click",()=>$("#mobNav").classList.toggle("open"));
window.addEventListener("scroll",()=>{ const y=window.scrollY; $("#hdr").classList.toggle("stuck",y>12); $("#toTop").classList.toggle("show",y>620); },{passive:true});
$("#toTop").addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));
document.addEventListener("click",e=>{
  if(e.target.closest("[data-theme-toggle]")){ toggleTheme(); return; }
  const t=e.target.closest("[data-act]");
  if(!t||t.closest("#adminPage")) return;
  const act=t.dataset.act,id=t.dataset.id;
  if(act==="download"){e.preventDefault();doDownload(id,t);}
  else if(act==="preview"){e.preventDefault();openPreview(id);}
  else if(act==="detail"){e.preventDefault();location.hash="#/work/"+encodeURIComponent(id);}
});

async function onContactSubmit(e){
  e.preventDefault();
  const f=e.currentTarget,btn=$("#cfBtn"); let ok=true; const data={};
  ["name","email","subject","body"].forEach(n=>{
    const i=f.elements[n],fl=i.closest(".fld"); fl.classList.remove("bad");
    const v=i.value.trim(); data[n]=v;
    if(i.required&&!v){fl.classList.add("bad");ok=false}
    if(n==="email"&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){fl.classList.add("bad");ok=false}
  });
  if(!ok){toast("لطفاً خطاهای فرم را برطرف کنید.","error");return}
  btn.disabled=true; btn.innerHTML='<span class="spin"></span><span>در حال ارسال…</span>';
  const id=uid(), rec=Object.assign({id,createdAt:Date.now(),read:false},data);
  const r=await safePut("messages/"+id,rec);
  S.messages.unshift(rec);
  logActivity("پیام جدید از «"+data.name+"» دریافت شد");
  btn.disabled=false; btn.innerHTML=ICON.send+'<span>'+esc(site("contact","formBtn","ارسال پیام"))+'</span>';

  refreshAdminIfOpen();
}
async function logActivity(text){
  const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const rec={id,text,at:Date.now()};
  S.activity.unshift(rec); S.activity=S.activity.slice(0,60);
  try{ await dbPut("activity/"+id,rec); }catch(e){ mirror.set("activity/"+id,rec); }

}

      dbGet("site"),dbGet("appearance"),dbGet("creds"),dbGet("portfolio"),dbGet("messages"),dbGet("activity"),dbGet("stats")

    if(appData) S.appearance=Object.assign({},DEFAULT_APP,appData); else await dbPut("appearance",DEFAULT_APP);
    if(credsData&&credsData.username) S.creds=Object.assign({},DEFAULT_CREDS,credsData); else await dbPut("creds",DEFAULT_CREDS);
    S.works=portfolio?Object.keys(portfolio).map(k=>Object.assign({id:k},portfolio[k])):[];
    S.messages=messages?Object.keys(messages).map(k=>Object.assign({id:k},messages[k])).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)):[];
    S.activity=activity?Object.keys(activity).map(k=>Object.assign({id:k},activity[k])).sort((a,b)=>(b.at||0)-(a.at||0)):[];
    S.stats=stats||{downloads:0};
    S.loaded=true;
    applyAppearance(); renderHeader(); renderSections(); writeCache(); refreshAdminIfOpen();
  }catch(err){
    handleDbError(err,"بارگذاری");
    S.loaded=true; renderHeader(); renderSections();
  }
}

  try{ const c=await dbGet("creds"); if(c&&c.username){creds=c;S.creds=Object.assign({},DEFAULT_CREDS,c);} }catch(_){}

  if(u===String(creds.username)&&p===String(creds.password)){
    S.session={user:u,at:Date.now()};
    try{sessionStorage.setItem(LS.sess,JSON.stringify(S.session))}catch(_){}

}

async function saveWork(f){
  const isNew=(A.editing==="new"||!A.editing);
  let ok=true;
  ["title","desc"].forEach(n=>{
    const el=f.elements[n], fl=el.closest(".fld"); if(fl) fl.classList.remove("bad");
    if(!el.value.trim()){ if(fl) fl.classList.add("bad"); ok=false; }
  });
  const pr=f.elements.price, prf=pr.closest(".fld"); if(prf) prf.classList.remove("bad");
  if(pr.value!==""&&(isNaN(Number(pr.value))||Number(pr.value)<0)){ if(prf) prf.classList.add("bad"); ok=false; }
  if(!ok){ toast("لطفاً فیلدهای الزامی را کامل کنید.","error"); window.scrollTo({top:0,behavior:"smooth"}); $("#admBody").scrollTop=0; return; }

  const btn=$("#wfSave"); if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span><span>در حال ذخیره…</span>'}
  saving(true,"در حال ذخیره‌سازی در پایگاه داده…");
  await sleep(60);

  const id=isNew?uid():A.editing;
  const ex=isNew?null:(S.works.find(x=>x.id===id)||{});
  const tags=Array.from(new Set($$('input[name="tags"]:checked',f).map(x=>x.value).concat(String(f.elements.tagsCustom.value||"").split(",").map(s=>s.trim()).filter(Boolean))));
  const P=A.pending||{};
  const meta={
    title:f.elements.title.value.trim(),
    desc:f.elements.desc.value.trim(),
    longDesc:f.elements.longDesc.value.trim(),
    category:f.elements.category.value.trim()||"عمومی",
    price:f.elements.price.value===""?"":Number(f.elements.price.value),
    tags:tags, published:f.elements.published.checked,
    order:Number(f.elements.order.value)||0,
    updatedAt:Date.now()
  };
  if(isNew){
    meta.id=id; meta.createdAt=Date.now(); meta.downloads=0;
    meta.cover=P.cover||""; meta.hasFile=(P.html!=null); meta.fileName=P.htmlName||"";
  }else{
    meta.id=id; meta.createdAt=ex.createdAt||Date.now(); meta.downloads=ex.downloads||0;
    meta.cover=P.rmCover?"":(P.cover||ex.cover||"");
    meta.hasFile=P.rmFile?false:((P.html!=null)||!!ex.hasFile);
    meta.fileName=P.rmFile?"":(P.htmlName||ex.fileName||"");
  }
  if(meta.hasFile&&!meta.fileName) meta.fileName=fileBase(meta.title)+".html";

  let r1=await safePut("portfolio/"+id,meta), r2=true;
  if(P.html!=null) r2=await safePut("files/"+id,{html:P.html,name:meta.fileName});
  if(P.rmFile&&!isNew) r2=(await safeDel("files/"+id))&&r2;

  const i=S.works.findIndex(x=>x.id===id);
  if(i>=0) S.works[i]=Object.assign({},S.works[i],meta); else S.works.push(meta);
  if(P.html!=null) S.files[id]={html:P.html,name:meta.fileName};
  if(P.rmFile) delete S.files[id];

  logActivity((isNew?"نمونه‌کار جدید «":"ویرایش نمونه‌کار «")+meta.title+"» "+(isNew?"اضافه شد":"به‌روزرسانی شد"));
  writeCache(); saving(false);
  toast((r1&&r2)?"نمونه‌کار با موفقیت ذخیره شد.":"ذخیره‌سازی به‌صورت محلی انجام شد (پایگاه داده در دسترس نبود).",(r1&&r2)?"success":"info",4400);
  A.pending=null; A.editing=null;
  renderHeader(); renderSections(); paintNav(); paintBody();
}
async function deleteWork(id){
  const w=S.works.find(x=>x.id===id); if(!w) return;
  const ok=await confirmDialog("حذف نمونه‌کار","آیا از حذف «"+w.title+"» مطمئن هستید؟ تصویر کاور، فایل HTML و تمام اطلاعات مرتبط برای همیشه پاک می‌شود. این عمل قابل بازگشت نیست.","حذف قطعی",true);
  if(!ok) return;

async function moveWork(id,dir){
  const list=adminWorkList();
  const i=list.findIndex(w=>w.id===id), j=i+dir;
  if(i<0||j<0||j>=list.length) return;
  const a=list[i],b=list[j];
  const ao=Number(a.order)||0, bo=Number(b.order)||0;
  let na,nb;
  if(ao===bo){ na=(dir>0)?ao+1:Math.max(0,ao-1); nb=ao; } else { na=bo; nb=ao; }
  a.order=na; b.order=nb;
  const wl=S.works.find(x=>x.id===a.id); if(wl) wl.order=na;
  const wl2=S.works.find(x=>x.id===b.id); if(wl2) wl2.order=nb;
  repaintRows(); renderSections();
  await safePut("portfolio/"+a.id+"/order",na);
  await safePut("portfolio/"+b.id+"/order",nb);
  writeCache();
  toast("ترتیب نمایش به‌روزرسانی شد","success",1700);
}
async function dragReorder(fromId,toId){
  if(!fromId||!toId||fromId===toId) return;
  const list=adminWorkList();
  const fi=list.findIndex(w=>w.id===fromId), ti=list.findIndex(w=>w.id===toId);
  if(fi<0||ti<0) return;
  const [m]=list.splice(fi,1); list.splice(ti,0,m);
  const ups=list.map((w,i)=>{ w.order=i+1; const t=S.works.find(x=>x.id===w.id); if(t) t.order=i+1; return {id:w.id,order:i+1}; });
  repaintRows(); renderSections();
  for(const u of ups) await safePut("portfolio/"+u.id+"/order",u.order);
  writeCache(); toast("ترتیب نمونه‌کارها ذخیره شد","success",2000);
}

async function saveSiteSection(key,btn){
  const form=document.getElementById("f_"+key);
  if(!form){ toast("فرم پیدا نشد","error"); return; }
  let ok=true;
  $$("input[required],textarea[required]",form).forEach(el=>{
    const fl=el.closest(".fld"); if(fl) fl.classList.remove("bad");
    if(!el.value.trim()){ if(fl) fl.classList.add("bad"); ok=false; }
  });
  if(key==="meta"&&!String(form.elements.brand.value||"").trim()){ ok=false; const fl=form.elements.brand.closest(".fld"); if(fl) fl.classList.add("bad"); }
  if(!ok){ toast("لطفاً فیلدهای الزامی را پر کنید.","error"); return; }
  const old=btn?btn.innerHTML:"";
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span><span>در حال ذخیره…</span>'}
  const data={};
  Array.from(form.elements).forEach(el=>{
    if(!el.name) return;
    if(el.type==="checkbox") data[el.name]=el.checked;
    else if(el.type==="number"||el.type==="range") data[el.name]=(el.value===""?"":Number(el.value));
    else data[el.name]=el.value;
  });
  if(A.imgs[key]!==undefined) data.image=A.imgs[key];
  S.site[key]=Object.assign({},S.site[key]||{},data);
  const r=await safePut("site/"+key,S.site[key]);
  delete A.imgs[key];
  const names={meta:"اطلاعات عمومی",hero:"بخش معرفی",about:"درباره من",works:"بخش نمونه‌کارها",contact:"اطلاعات تماس",footer:"پاورقی",appearance:"تنظیمات ظاهری"};
  logActivity("«"+(names[key]||key)+"» به‌روزرسانی شد");
  writeCache(); applyAppearance(); renderHeader(); renderSections();
  if(btn){btn.disabled=false;btn.innerHTML=ICON.check+'<span>ذخیره شد</span>';setTimeout(()=>{btn.innerHTML=old},1700)}
  toast(r?"تغییرات ذخیره و در سایت اعمال شد.":"تغییرات فقط محلی ذخیره شد.",r?"success":"info",4200);
}

async function saveCreds(f){
  const cu=f.elements.cu.value.trim(),cp=f.elements.cp.value;
  const nu=f.elements.nu.value.trim(),np=f.elements.np.value,np2=f.elements.np2.value;
  ["cu","cp","nu","np","np2"].forEach(n=>{const fl=f.elements[n].closest(".fld");if(fl)fl.classList.remove("bad")});
  const bad=n=>{const fl=f.elements[n].closest(".fld");if(fl)fl.classList.add("bad")};
  let ok=true;
  if(!cu){bad("cu");ok=false} if(!cp){bad("cp");ok=false} if(!nu){bad("nu");ok=false}
  if(np.length<4){bad("np");ok=false} if(np!==np2){bad("np2");ok=false}
  if(!ok){toast("لطفاً تمام فیلدها را درست پر کنید.","error");return}

  const btn=$("#credBtn"); btn.disabled=true; btn.innerHTML='<span class="spin"></span><span>در حال به‌روزرسانی…</span>';
  const next={username:nu,password:np};
  const r=await safePut("creds",next);
  S.creds=next; S.session={user:nu,at:Date.now()};
  try{sessionStorage.setItem(LS.sess,JSON.stringify(S.session))}catch(_){}
  logActivity("اطلاعات ورود مدیر تغییر کرد");
  writeCache();

async function onSiteImg(input){
  const key=input.dataset.img, f=input.files&&input.files[0]; if(!key||!f) return;
  if(!/^image\//.test(f.type)){ toast("فقط فایل تصویری مجاز است.","error"); input.value=""; return; }
  try{

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onerror=()=>reject(new Error("خواندن فایل ناموفق بود"));
    fr.onload=()=>{
      const src=fr.result;
      if(/svg/i.test(file.type)||/\.svg$/i.test(file.name)){ resolve(src); return; }
      const img=new Image();
      img.onerror=()=>reject(new Error("فایل تصویر معتبر نیست"));
      img.onload=()=>{
        let w=img.naturalWidth,h=img.naturalHeight;
        if(w>1280){h=Math.round(h*1280/w);w=1280}
        if(h>1400){w=Math.round(w*1400/h);h=1400}
        const c=document.createElement("canvas"); c.width=w; c.height=h;
        const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h);
        let q=.82,out=c.toDataURL("image/jpeg",q);
        while(out.length>1.35*1024*1024&&q>.45){ q-=.09; out=c.toDataURL("image/jpeg",q); }
        if(out.length>src.length) out=src;
        resolve(out);
      };
      img.src=src;
    };
    fr.readAsDataURL(file);
  });
}

  tr.classList.add("dragging");
}
function onDragOver(e){ const tr=e.target.closest("#wRows tr"); if(tr){e.preventDefault();tr.classList.add("dragover")} }
function onDragLeave(e){ const tr=e.target.closest("#wRows tr"); if(tr) tr.classList.remove("dragover"); }
function onDragEnd(e){ const tr=e.target.closest("#wRows tr"); if(tr){tr.classList.remove("dragover");tr.classList.remove("dragging")} }
function onDrop(e){
  const tr=e.target.closest("#wRows tr"); if(!tr) return;
  e.preventDefault(); tr.classList.remove("dragover");
  const from=e.dataTransfer.getData("text/plain");
  if(from&&tr.dataset.id&&from!==tr.dataset.id) dragReorder(from,tr.dataset.id);
}

function onAdmClick(e){
  const eye=e.target.closest('[data-a="eye"]');
  if(eye){ const i=eye.parentElement.querySelector("input"); if(i){ i.type=(i.type==="password")?"text":"password"; eye.innerHTML=(i.type==="text")?ICON.eye:ICON.eye; } return; }
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a;
  switch(a){
    case "tab": e.preventDefault(); A.tab=el.dataset.v; A.editing=null; paintNav(); paintBody(); break;
    case "openSide": $("#admSide").classList.add("open"); $("#admScrim").classList.add("open"); break;
    case "closeSide": $("#admSide").classList.remove("open"); $("#admScrim").classList.remove("open"); break;
    case "theme": toggleTheme(); break;
    case "reload": renderAdmin(); break;
    case "logout": doLogout(); break;
    case "newWork": A.editing="new"; A.pending={}; paintBody(); updateLive(); break;
    case "editWork": A.editing=el.dataset.id; A.pending={}; paintBody(); updateLive(); break;
    case "back": A.editing=null; A.pending=null; paintNav(); paintBody(); break;
    case "delWork": deleteWork(el.dataset.id); break;
    case "mvWork": moveWork(el.dataset.id, el.dataset.v==="up"?-1:1); break;
    case "dl": doDownload(el.dataset.id, el); break;
    case "pv": openPreview(el.dataset.id); break;
    case "rmCover": A.pending=A.pending||{}; A.pending.cover=null; A.pending.rmCover=true; $("#coverPrev").innerHTML=""; $("#coverMeta").textContent="تصویر حذف شد — یک کاور گرافیکی خودکار ساخته می‌شود."; updateLive(); break;
    case "rmHtml": A.pending=A.pending||{}; A.pending.html=null; A.pending.htmlName=null; A.pending.rmFile=true; $("#filePrev").innerHTML=""; break;
    case "rmImg": { const k=el.dataset.k; A.imgs[k]=""; el.closest(".prev").remove(); toast("تصویر حذف شد — «ذخیره» را بزنید.","info"); break; }
    case "saveSite": saveSiteSection(el.dataset.key,el); break;
    case "saveSocial": saveContactAll(el,false); break;
    case "secMove": moveSection(el.dataset.k, el.dataset.v==="up"?-1:1); break;
    case "msgRead": markMsg(el.dataset.id,true); break;
    case "msgDel": delMsg(el.dataset.id); break;
    case "msgAll": markAllMsg(); break;
    case "dbReload": dbReload(el); break;
    case "dbExport": dbExport(); break;
    case "dbSync": dbSync(el); break;
    case "dbClear": clearLocal(); break;
    case "preset": applyPreset(el.dataset.v); break;
    case "resetApp": resetAppearance(); break;
  }
}
async function doLogout(){
  const ok=await confirmDialog("خروج از پنل","آیا می‌خواهید از پنل مدیریت خارج شوید؟","خروج",true);
  if(!ok) return;
  S.session=null; try{sessionStorage.removeItem(LS.sess)}catch(_){}
  const p=$("#adminPage"); p.dataset.shell=""; renderAdmin();
  toast("از پنل مدیریت خارج شدید","info");
}
async function markMsg(id,on){
  const m=S.messages.find(x=>x.id===id); if(!m) return;
  m.read=on; await safePut("messages/"+id+"/read",on); writeCache(); paintNav(); paintBody();
}
async function markAllMsg(){
  saving(true,"در حال به‌روزرسانی…");
  for(const m of S.messages){ if(!m.read){ m.read=true; await safePut("messages/"+m.id+"/read",true); } }
  writeCache(); saving(false); paintNav(); paintBody(); toast("همه پیام‌ها خوانده شدند","success");
}
async function delMsg(id){
  const ok=await confirmDialog("حذف پیام","آیا از حذف این پیام مطمئن هستید؟","حذف",true);
  if(!ok) return;
  S.messages=S.messages.filter(x=>x.id!==id);
  await safeDel("messages/"+id); writeCache(); paintNav(); paintBody(); toast("پیام حذف شد","success");
}
async function clearLocal(){
  const ok=await confirmDialog("پاک‌سازی حافظه محلی","فقط داده‌های کش‌شده در مرورگر پاک می‌شود. اطلاعات داخل Firebase دست‌نخورده می‌ماند.","پاک‌سازی",true);
  if(ok){ localStorage.removeItem(LS.cache); toast("حافظه محلی پاک شد","success"); }
}
function applyPreset(v){
  const p=String(v||"").split("|"); if(p.length<2) return;
  const acA=$("#acA"),acB=$("#acB");
  if(acA){acA.value=p[0];$("#acAt").value=p[0]}
  if(acB){acB.value=p[1];$("#acBt").value=p[1]}
  document.documentElement.style.setProperty("--accent",p[0]);
  document.documentElement.style.setProperty("--accent2",p[1]);
  S.appearance.accent=p[0]; S.appearance.accent2=p[1];
  toast("پالت اعمال شد — برای ماندگاری «ذخیره» را بزنید.","info",2600);
}
async function resetAppearance(){
  S.appearance=Object.assign({},DEFAULT_APP);
  applyAppearance(); paintBody();
  await safePut("appearance",S.appearance); writeCache();
  toast("تنظیمات ظاهری به حالت پیش‌فرض برگشت","success");
}
let qTimer=null;
function onAdmInput(e){
  const t=e.target;
  if(t.id==="admWq"){ A.q=t.value; clearTimeout(qTimer); qTimer=setTimeout(()=>{ const p=t.selectionStart; repaintRows(); const n=$("#admWq"); if(n){n.focus();try{n.setSelectionRange(p,p)}catch(_){}}},220); return; }
  if(t.id==="acA"){ document.documentElement.style.setProperty("--accent",t.value); const o=$("#acAt"); if(o)o.value=t.value; return; }
  if(t.id==="acB"){ document.documentElement.style.setProperty("--accent2",t.value); const o=$("#acBt"); if(o)o.value=t.value; return; }
  if(t.id==="rvIn"){ document.documentElement.style.setProperty("--radius",t.value+"px"); const o=$("#rvOut"); if(o)o.textContent=t.value; return; }
  if(t.id==="fsIn"){ document.documentElement.style.setProperty("--fs",t.value); const o=$("#fsOut"); if(o)o.textContent=Number(t.value).toFixed(2); return; }
  if(t.id==="hbSel"||t.name==="animations"){ applyLiveAppearance(); return; }
  if(t.closest("#workForm")){ updateLive(); }
}
function onAdmChange(e){
  const t=e.target;
  if(t.matches('input[type="file"][data-role="cover"]')) return onCoverFile(t);
  if(t.matches('input[type="file"][data-role="html"]')) return onHtmlFile(t);
  if(t.matches('input[type="file"][data-img]')) return onSiteImg(t);
  if(t.dataset.pub) return togglePublish(t.dataset.pub,t.checked);
  if(t.dataset.vis) return toggleSection(t.dataset.vis,t.checked);
  if(t.id==="hbSel"||t.name==="animations") return applyLiveAppearance();
  if(t.closest("#workForm")) return updateLive();
}
function applyLiveAppearance(){
  const f=$("#f_appearance"); if(!f) return;
  S.appearance=Object.assign({},S.appearance,{
    accent:$("#acA").value, accent2:$("#acB").value,
    radius:Number($("#rvIn").value), fontScale:Number($("#fsIn").value),
    heroBg:$("#hbSel").value, animations:f.elements.animations.checked
  });
  applyAppearance();
}
function onAdmSubmit(e){
  const f=e.target; e.preventDefault();
  if(f.id==="loginForm") return doLogin(f);
  if(f.id==="workForm") return saveWork(f);
  if(f.id==="fCreds") return saveCreds(f);
  if(f.dataset&&f.dataset.form) { const b=$('[data-a="saveSite"][data-key="'+f.dataset.form+'"]'); return saveSiteSection(f.dataset.form,b); }
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if($("#modalBd").style.display==="grid") return;
    if($("#adminPage").classList.contains("open")){
      const side=$("#admSide");
      if(side&&side.classList.contains("open")){ side.classList.remove("open"); $("#admScrim").classList.remove("open"); return; }
      if(A.editing!==null&&S.session){ A.editing=null; paintNav(); paintBody(); }
    }
  }
});

/* ================================================================== BOOT */
(function boot(){
  initTheme();
  try{ const s=JSON.parse(sessionStorage.getItem(LS.sess)||"null"); if(s&&s.user) S.session=s; }catch(e){}
  readCache(); applyAppearance(); renderHeader(); renderSections(); router();
  loadAll(true).then(()=>{ router(); if(DB_MODE==="online") netbar(""); });
})();
</script>
</body>
</html>
